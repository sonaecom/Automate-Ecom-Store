# synthetic
# Copy to ~/.automate-ecom-store/tasks.yaml. Do not put a profile id or a shop name here.
# One queue per store label. One browser session at a time.
# session_minutes must stay from 30 to 40. A longer session is rejected.

dedupe_window_hours: 24
session_minutes: 40
chunk_minutes: 10
daily_sessions: 1
# KOL chat. Owner pins still sort first. The rest of a session rolls forward.
kol_messages_per_session: 30
kol_custom_invites_per_session: 10
